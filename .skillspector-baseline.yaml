# SkillSpector baseline — findings listed here are suppressed on future scans.
# Edit 'reason' fields and add glob 'rules' as needed. See docs/SUPPRESSION.md.
version: 2
scanner_version: 2.11.2
rules:
- id: P2
  path: docs/architecture/*.md
  message: '*arc-steward:*'
  reason: >-
    The repository's own architecture documentation, generated by this skill. P2 matches
    from each arc-steward:generated or arc-steward:refs marker to the next '-->', which in a Mermaid
    block is an arrow, so generated blocks are flagged. A rule instead of fingerprints,
    because every refresh rewrites the blocks. This rule would also hide a real hidden
    instruction placed next to a marker; tests/test_own_docs.py closes that gap by failing
    on any HTML comment in docs/architecture that is not marker syntax, and on invisible format
    characters.
