name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python3 -m unittest discover -s tests -v

  skillspector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv tool install git+https://github.com/NVIDIA/skillspector.git@v2.11.2
      - name: Scan and fail on any unsuppressed finding
        run: |
          report="$RUNNER_TEMP/skillspector.json"
          status=0
          skillspector scan . --no-llm --baseline .skillspector-baseline.yaml --format json --output "$report" || status=$?
          jq -r '.issues[] | "\(.severity) \(.id) \(.location.file):\(.location.start_line) \(.pattern)"' "$report"
          jq -e '.issues | length == 0' "$report" > /dev/null && exit "$status"
